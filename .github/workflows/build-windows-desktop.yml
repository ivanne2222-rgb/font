name: Build Windows TTF Studio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-desktop.yml'
permissions:
  contents: write
concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s desktop/tests -v
      - name: Build Windows executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TTFStudio ttf_studio.pyw
      - name: Test packaged executable
        working-directory: desktop
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests').resolve()))
          from test_model import fixture
          Path('smoke-input.ttf').write_bytes(fixture())
          process = subprocess.run([str(Path('dist/TTFStudio.exe').resolve()), '--smoke-test', str(Path('smoke-input.ttf').resolve()), str(Path('portable-smoke-result.json').resolve())], timeout=120)
          assert process.returncode == 0, f'EXE exit code: {process.returncode}'
          result = json.loads(Path('portable-smoke-result.json').read_text(encoding='utf-8'))
          print(json.dumps(result, ensure_ascii=False))
          assert result['status'] == 'passed'
      - name: Create portable ZIP
        run: python desktop/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: TTFStudio-Windows-Portable
          path: |
            downloads/TTF-Studio-Windows-Portable.zip
            downloads/TTF-Studio-Windows-Portable.zip.sha256
          if-no-files-found: error
      - name: Publish downloadable package to repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/TTF-Studio-Windows-Portable.zip downloads/TTF-Studio-Windows-Portable.zip.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Publish verified Windows portable executable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
