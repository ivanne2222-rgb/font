name: Build Windows TTF Studio
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s desktop/tests -v
      - name: Build executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TTFStudio ttf_studio.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: TTFStudio-Windows
          path: desktop/dist/TTFStudio.exe
          if-no-files-found: error
